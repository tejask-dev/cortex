name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - name: Clean wheel installation and CLI smoke
        shell: bash
        run: |
          uv venv /tmp/cortex-clean
          uv pip install --python /tmp/cortex-clean/bin/python dist/*.whl
          /tmp/cortex-clean/bin/cortex --json init /tmp/cortex-brain
          /tmp/cortex-clean/bin/cortex --brain /tmp/cortex-brain --json remember 'Synthetic CI memory' --title 'CI sample'
          /tmp/cortex-clean/bin/cortex --brain /tmp/cortex-brain --json search 'CI sample'
          /tmp/cortex-clean/bin/cortex --brain /tmp/cortex-brain --json doctor
